<div style="max-width: 600px; margin: 50px auto; font-family: Arial, sans-serif; text-align: center;">
    <h1>¡Bienvenido a la aplicación!</h1>

    <!-- Contenedor de datos del perfil -->
    <div *ngIf="perfil"
        style="background: #f8f9fa; padding: 20px; border-radius: 5px; margin: 20px 0; border: 1px solid #dee2e6;">
        <h3>Tus datos de perfil:</h3>
        <p><strong>Nombre:</strong> {{ perfil.nombre }}</p>
        <p><strong>Correo:</strong> {{ perfil.email }}</p>
    </div>

    <!-- Botón para abrir el modal de enviar información -->
    <div style="margin-bottom: 20px;">
        <button (click)="abrirModal()"
            style="padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
            Enviar información por correo
        </button>
    </div>

    <!-- Botón para cerrar sesión -->
    <div>
        <button (click)="salir()"
            style="padding: 10px 20px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
            Cerrar Sesión
        </button>
    </div>

    <!-- VENTANA MODAL -->
    <div *ngIf="mostrarModal"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; text-align: left;">
        <div
            style="background: white; padding: 25px; border-radius: 8px; width: 450px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <h3 style="margin-top: 0; text-align: center;">Enviar Información</h3>

            <form (ngSubmit)="enviarDatosCorreo()">
                <div style="margin-bottom: 15px;">
                    <label><strong>Datos adicionales o mensaje:</strong></label><br>
                    <textarea [(ngModel)]="datosAdicionales" name="datosAdicionales" rows="3" required
                        placeholder="Escribe aquí los datos..."
                        style="width: 100%; padding: 8px; box-sizing: border-box;"></textarea>
                </div>

                <div style="margin-bottom: 15px;">
                    <label><strong>Correo(s) de destino:</strong></label><br>
                    <input type="text" [(ngModel)]="correosDestino" name="correosDestino" required
                        placeholder="ejemplo@ucaldas.edu.co" style="width: 100%; padding: 8px; box-sizing: border-box;">
                    <small style="color: #6c757d;">Sepáralos con comas si es más de uno.</small>
                </div>

                <div style="display: flex; justify-content: space-between;">
                    <button type="submit"
                        style="padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Enviar</button>
                    <button type="button" (click)="cerrarModal()"
                        style="padding: 8px 15px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</div>
