<div style="max-width: 400px; margin: 50px auto; font-family: Arial, sans-serif;">
  <h2>Registro de Usuario</h2>
  
  <div *ngIf="errorMensaje" style="color: red; margin-bottom: 10px;">
    {{ errorMensaje }}
  </div>

  <form (ngSubmit)="registrarse()">
    <div style="margin-bottom: 15px;">
      <label>Nombre:</label><br>
      <input type="text" [(ngModel)]="nombre" name="nombre" required style="width: 100%; padding: 8px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label>Correo electrónico:</label><br>
      <input type="email" [(ngModel)]="email" name="email" required style="width: 100%; padding: 8px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label>Contraseña:</label><br>
      <input type="password" [(ngModel)]="password" name="password" required style="width: 100%; padding: 8px;">
    </div>

    <button type="submit" style="width: 100%; padding: 10px; background: #007bff; color: white; border: none;">Registrarse</button>
  </form>

  <p style="margin-top: 15px; text-align: center;">
    ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a>
  </p>
</div>
